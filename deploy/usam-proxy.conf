# /etc/nginx/snippets/usam-proxy.conf  (included by every location)
proxy_pass http://usam_app;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# The app trusts only loopback as a proxy, so it reads the real client IP from
# this header for rate limiting and audit logs.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Correlate Nginx and app logs: reuse an inbound id or mint one.
proxy_set_header X-Request-Id $request_id;
proxy_hide_header Strict-Transport-Security;   # Nginx sets the one HSTS header
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
