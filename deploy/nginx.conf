# /etc/nginx/sites-available/usam-communities
#
# Replace usam.example with the real domain (ec2-setup.sh does this for you).
# TLS certificates are issued by Certbot (deploy/ssl-setup.sh), which fills in
# the ssl_certificate lines below on first run.
#
# Design: Nginx terminates TLS and proxies EVERYTHING to the Node app on
# 127.0.0.1:3001. The app serves the SPA and sets the Content-Security-Policy
# and other security headers; serving index.html straight from Nginx would
# bypass them, so it deliberately does not.

# ---- Access log WITHOUT query strings --------------------------------------
# The default `combined` format logs the whole request line, which would write
# one-time secrets (/verify-email?token=..., /reset-password?token=...) to disk
# and on to CloudWatch. $uri is the path only. $request_id correlates with the
# app's X-Request-Id.
log_format usam '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                '$status $body_bytes_sent "$http_user_agent" rid=$request_id rt=$request_time';

# ---- Rate-limit zones (per client IP) -------------------------------------
limit_req_zone $binary_remote_addr zone=usam_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=usam_auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=usam_conn:10m;

upstream usam_app {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# ---- HTTP: redirect everything to HTTPS (except ACME challenges) ---------
server {
    listen 80;
    listen [::]:80;
    server_name usam.example www.usam.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://usam.example$request_uri;
    }
}

# ---- HTTPS ----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name usam.example;

    ssl_certificate     /etc/letsencrypt/live/usam.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usam.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # HSTS is set HERE (so it also covers Nginx-generated error pages). The app
    # sends one too, so usam-proxy.conf hides the upstream copy - otherwise every
    # response carries two Strict-Transport-Security headers (caught by
    # scripts/nginx-integration.sh). All other security headers (CSP, nosniff,
    # frame-ancestors, ...) come from the app only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
    limit_conn usam_conn 40;

    # Default request cap. The app's JSON limit is 80 KB; leave headroom for
    # headers/overhead. Only the avatar upload gets a larger body (below).
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml application/xml;

    # Never expose dotfiles / VCS / env files, whatever the app does.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # ---- Credential endpoints: strict per-IP throttle (on top of the app's) --
    location ~ ^/api/v1/auth/(login|signup|password/forgot|password/reset|verify-email|resend-verification)$ {
        limit_req zone=usam_auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/usam-proxy.conf;
    }

    # ---- Payment webhook: reachable by Paymob, no throttle, tiny body ------
    location = /api/v1/payments/webhook/paymob {
        client_max_body_size 128k;
        include /etc/nginx/snippets/usam-proxy.conf;
    }

    # ---- Avatar upload: base64 image in JSON (policy: MAX_UPLOAD_BYTES x 1.4) ----
    location = /api/v1/users/me/avatar {
        client_max_body_size 15m;
        client_body_timeout 60s;
        limit_req zone=usam_api burst=5 nodelay;
        include /etc/nginx/snippets/usam-proxy.conf;
    }

    # ---- Everything else under /api --------------------------------------
    location /api/ {
        limit_req zone=usam_api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/usam-proxy.conf;
    }

    # ---- SPA, static assets, health --------------------------------------
    location / {
        include /etc/nginx/snippets/usam-proxy.conf;
    }

    access_log /var/log/nginx/usam.access.log usam;
    error_log  /var/log/nginx/usam.error.log warn;
}
