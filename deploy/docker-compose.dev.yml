services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: usam_hub
      MYSQL_USER: usam
      MYSQL_PASSWORD: local_dev_only
      MYSQL_ROOT_PASSWORD: local_root_only
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["mysql_dev:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 4s
      retries: 12
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_dev:/data"]
volumes:
  mysql_dev:
  redis_dev:
