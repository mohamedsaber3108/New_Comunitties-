name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan over full git history (redacted)
        run: docker run --rm -v ${{ github.workspace }}:/repo zricethezav/gitleaks:v8.24.2 git /repo --redact --verbose --exit-code 1
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: usam
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: usam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U usam" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Production build (real API) and preview build
        run: npm run build:ec2 && npm run build
      - name: API documentation matches the live router
        run: node scripts/gen-api-docs.mjs /tmp/api.md
      - name: Server tests (SQLite)
        run: npm test
      - name: Server tests (PostgreSQL)
        run: node --test server/*.test.js
        env:
          TEST_DB_DIALECT: postgres
          TEST_PG_ADMIN_URL: postgres://usam:ci_only@127.0.0.1:5432/postgres
      - name: Shell script syntax
        run: for f in deploy/*.sh scripts/*.sh; do bash -n "$f"; done
      - name: Dependency advisories (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
  e2e:
    runs-on: ubuntu-24.04
    needs: [verify, secrets]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:ec2
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
